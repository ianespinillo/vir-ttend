name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
      - develop

jobs:
  pre-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js and Pnpm
        uses: actions/setup-node@v3
        with:
          node-version: 20.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Pre-build
        run: pnpm build --filter=@repo/*

      - name: Lint (Biome)
        run: pnpm lint:check

      - name: Type check
        run: pnpm ts:check

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm build