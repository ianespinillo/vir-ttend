services:
  postgres:
    image: postgres:16-alpine
    container_name: vir-ttend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virttend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2026virttend}
      POSTGRES_DB: ${POSTGRES_DB:-vir_ttend}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vir-ttend_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/dockerfile
    image: vir-ttend-api
    container_name: vir-ttend_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    # Optional API settings (tenancy, bootstrap admin, SMTP...) come from the
    # root .env; the explicit values below take precedence over it.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
      NODE_ENV: production
      # dev/http: cookies sin flag Secure (Android rechaza Secure sobre http)
      COOKIES_SECURE: ${COOKIES_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-virttend}:${POSTGRES_PASSWORD:-2026virttend}@postgres:5432/${POSTGRES_DB:-vir_ttend}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-vir_ttend_super_secret_jwt_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-vir_ttend_super_secret_refresh_jwt_key_2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_TENANCY_MODE: ${NEXT_PUBLIC_TENANCY_MODE:-multi}
    image: vir-ttend-client
    container_name: vir-ttend_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_TENANCY_MODE: ${NEXT_PUBLIC_TENANCY_MODE:-multi}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
